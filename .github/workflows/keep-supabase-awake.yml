# 무료 Supabase는 일주일 동안 요청이 없으면 멈춰요.
# 3일마다 가벼운 요청을 한 번 보내서 깨어 있게 해요.
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          # config.js에 있는 공개 키와 같아요
          SUPABASE_URL: https://rvogrkzzstnjtrxsvprk.supabase.co
          SUPABASE_KEY: sb_publishable_nX4kx2ZkUfkuWMAGVUSTcw_vFsURVfQ
        run: |
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/check_invite" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{"c":"keepalive"}'
