<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="booklog-supabase.js"></script>
</head>
<body>
<title>먼슬리 북로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: an index catalogue. Thin black rules frame a metadata bar; the month is a numbered 7-column index of covers;
   the shelf view stands every finished book as a flat-colour spine, as thick as its page count, one shelf per month. */
:root {
  --bg: #F0F0EF;
  --ink: #111111;
  --muted: #727272;
  --soft: #D9D9D7;
  --hover: #E4E4E2;
  --surface: #FFFFFF;
  --red: #E5332A;
  --star: #E5332A;
  --shelf-h: 300px;
  --f: "Helvetica Neue", Helvetica, Arial, "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --ink: #EDEDED; --muted: #9A9A9A; --soft: #2E2E2E; --hover: #222222;
    --surface: #1D1D1D; --red: #FF5B4F; --star: #FF5B4F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --ink: #EDEDED; --muted: #9A9A9A; --soft: #2E2E2E; --hover: #222222;
  --surface: #1D1D1D; --red: #FF5B4F; --star: #FF5B4F; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f); font-size: 14px; line-height: 1.5;
  padding-inline: 16px; padding-block: 20px 120px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num-t { font-variant-numeric: tabular-nums; }

.page { display: grid; gap: 18px; }

/* ── Metadata bar and footer, like a catalogue's running head ── */
.bar {
  display: grid; grid-template-columns: 1.2fr 1fr 1.4fr auto; gap: 12px; align-items: baseline;
  font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--ink);
}
.bar span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .act { font-size: 12px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.bar .act:hover { color: var(--red); }
.bar .act:disabled { opacity: .5; cursor: progress; }
.foot {
  display: grid; grid-template-columns: 1fr auto; gap: 12px;
  font-size: 12px; padding-top: 6px; border-top: 1px solid var(--ink);
}
.foot span:last-child { text-align: right; }

.titlerow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.titlerow h1 {
  margin: 0; font-size: clamp(44px, 11vw, 76px); font-weight: 500; line-height: .9; letter-spacing: -0.03em;
}
.titlerow .sub { font-size: 13px; color: var(--muted); }
.nav { display: flex; gap: 2px; align-items: center; }
.nav button { height: 30px; min-width: 30px; padding-inline: 8px; font-size: 13px; }
.nav button:hover { color: var(--red); }
.nav .arrow { font-size: 18px; }
.side { align-self: stretch; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 8px; }
.side .nav { margin-right: -8px; margin-bottom: -6px; }
.print { font-size: 12px; line-height: 1; padding-top: 2px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.print:hover { color: var(--red); }
.print:disabled { opacity: .5; cursor: progress; }
.prints { display: flex; gap: 14px; }

/* Written records for print: A4 landscape, two columns. Only shown while printing them. */
#print-notes-root { display: none; }
@media print {
  html.printing-notes body > *:not(#print-notes-root) { display: none !important; }
  html.printing-notes #print-notes-root { display: block; }
  html.printing-notes body { padding: 0; background: #fff; }
}
.pn { color: #111; font-family: var(--f); font-size: 9.5pt; line-height: 1.55; }
.pn-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1pt solid #111; padding-bottom: 2mm; margin-bottom: 5mm; }
.pn-head h1 { margin: 0; font-size: 26pt; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.pn-head span { font-size: 8.5pt; }
.pn-cols { column-count: 2; column-fill: auto; column-gap: 12mm; column-rule: .3pt solid #ccc; }
.pn-entry { padding-bottom: 4mm; margin-bottom: 4mm; border-bottom: .3pt solid #ccc; }
.pn-top { display: grid; grid-template-columns: 20mm 1fr; gap: 4mm; align-items: start; }
.pn-top, .pn-q { break-inside: avoid; }
.pn-top, .pn-sec b { break-after: avoid; }
.pn p { orphans: 2; widows: 2; }
.pn-top.noimg { grid-template-columns: 1fr; }
.pn-top img { width: 20mm; aspect-ratio: 2 / 3; object-fit: cover; display: block; }
.pn-diary .pn-top { grid-template-columns: 36mm 1fr; }
.pn-diary .pn-top img { width: 36mm; aspect-ratio: auto; max-height: 48mm; object-fit: contain; object-position: left top; }
.pn-date { font-size: 8pt; color: #666; font-variant-numeric: tabular-nums; }
.pn-title { font-size: 12pt; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: .5mm 0 1mm; }
.pn-meta { font-size: 8.5pt; color: #444; }
.pn-stars { font-size: 9pt; letter-spacing: 1pt; color: #E5332A; }
.pn-sec { margin-top: 2.5mm; }
.pn-sec b { display: block; font-size: 7.5pt; font-weight: 500; color: #777; letter-spacing: .04em; margin-bottom: .5mm; }
.pn-sec p { margin: 0; white-space: pre-wrap; }
.pn-q { display: grid; grid-template-columns: 9mm 1fr; gap: 1mm; margin-bottom: 1mm; }
.pn-q span { color: #777; font-size: 8pt; font-variant-numeric: tabular-nums; }

/* ── Month index ── */
.weekdays, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 8px; }
.weekdays span { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.weekdays span:first-child { color: var(--red); }
.grid { row-gap: 14px; }
.day { display: grid; gap: 5px; align-content: start; min-width: 0; }
.day.pad { visibility: hidden; }
.day .n {
  font-size: 17px; font-weight: 500; line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; justify-self: start; padding: 2px 3px 2px 0;
}
.day.sun .n { color: var(--red); }
.day.today .n { background: var(--ink); color: var(--bg); padding: 2px 4px; }
.slot { position: relative; aspect-ratio: 2 / 3; max-width: 100%; overflow: hidden; }
.slot .add { position: absolute; inset: 0; width: 100%; transition: background .12s; border-top: 1px solid var(--soft); }
.slot .add:not(.static):hover { background: var(--hover); }
.slot .add::after {
  content: "+"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  font-size: 18px; color: var(--muted); opacity: 0; transition: opacity .12s;
}
.slot .add:not(.static):hover::after, .slot .add:focus-visible::after { opacity: 1; }
.covers { position: absolute; inset: 0; display: flex; gap: 2px; }
.cover-btn { flex: 1; min-width: 0; height: 100%; overflow: hidden; }
.cover-btn img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.cover-btn:hover img { transform: scale(1.04); }
.cover-btn .plain {
  width: 100%; height: 100%; display: flex; align-items: flex-end; padding: 5px;
  background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 500; line-height: 1.25;
  text-align: left; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere;
}
.more {
  position: absolute; right: 3px; bottom: 3px; pointer-events: none;
  background: var(--red); color: #fff; font-size: 10px; line-height: 1; padding: 3px 4px;
}
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* ── Shelf view ── */
.shelves { display: grid; gap: 34px; }
.shelf { display: grid; gap: 10px; }
.shelf-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--soft); }
.shelf-head b { font-weight: 500; }
.row { display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: 18px; min-height: var(--shelf-h); }
.spine {
  height: calc(var(--shelf-h) * var(--k, 1)); flex: none;
  writing-mode: vertical-rl; text-orientation: sideways;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; overflow: hidden; white-space: nowrap;
  transition: transform .18s ease;
}
.spine:hover, .spine:focus-visible { transform: translateY(-8px); }
.spine .t, .spine .a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.2; }
.spine .t { font-weight: 500; letter-spacing: -0.01em; max-inline-size: 72%; }
.spine .a { font-size: 10px; opacity: .85; max-inline-size: 26%; }
.spine.thin .a { display: none; }
.spine.thin .t { max-inline-size: 100%; }
.empty { font-size: 13px; color: var(--muted); padding-block: 40px; border-top: 1px solid var(--soft); margin: 0; }

.notice { margin: 0; padding: 12px 14px; border: 1px solid var(--ink); font-size: 13px; line-height: 1.6; }

/* ── Friends: round profile pictures on a dark tray ── */
.people {
  display: flex; flex-wrap: wrap; gap: 18px 14px; justify-content: center;
  background: #1C1C1C; color: #EDEDED; border-radius: 28px; padding: 18px 20px 14px;
}
.person { display: grid; justify-items: center; gap: 6px; width: 72px; }
.person .ring { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: #2E2E2E; display: grid; place-items: center; transition: transform .15s; }
.person:hover .ring { transform: scale(1.06); }
.person .ring img { width: 100%; height: 100%; object-fit: cover; }
.person .initial { font-size: 22px; font-weight: 500; color: #EDEDED; }
.people { padding: 16px 20px; }
.person .label { font-size: 11px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person.me .label { opacity: .6; }
.friend-head { display: flex; align-items: center; gap: 14px; }
.friend-head .ring { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: var(--soft); flex: none; display: grid; place-items: center; }
.friend-head .ring img { width: 100%; height: 100%; object-fit: cover; }
.friend-head .initial { font-size: 22px; font-weight: 500; color: var(--ink); }
.tabs { display: flex; gap: 14px; font-size: 13px; }
.tabs button { color: var(--muted); padding: 2px 0; }
.tabs button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.static { cursor: default; }
.spine.static:hover { transform: none; }

/* Join */
.join { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 28px 24px 22px; }
.join h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.join p { margin: 0; font-size: 13px; color: var(--muted); }
.avatar-pick {
  width: 112px; height: 112px; border-radius: 50%; overflow: hidden; position: relative;
  border: 1px dashed var(--muted); display: grid; place-items: center; color: var(--muted); font-size: 12px; background: var(--bg);
}
.avatar-pick.filled { border: 0; }
.avatar-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.join .field { width: min(260px, 100%); }
.join .field input { text-align: center; font-size: 16px; }
.join .primary {
  background: var(--ink); color: var(--surface); padding: 10px 26px; border-radius: 999px; font-size: 14px; font-weight: 500;
}
.join .primary:disabled { opacity: .35; cursor: not-allowed; }
.back { font-size: 13px; justify-self: start; padding: 4px 0; }
.back:hover { color: var(--red); }
.friend-name { font-size: clamp(32px, 8vw, 52px); font-weight: 500; letter-spacing: -0.03em; line-height: 1; margin: 0; }
.readonly .cover-pick { cursor: default; }
.readonly .cover-pick .swap, .readonly #add-quote, .readonly .q-del { display: none; }
.readonly .stars button { cursor: default; }
.readonly .stars button:hover { transform: none; }
.readonly .field input, .readonly .field textarea { border-bottom-color: transparent; }
.readonly .field input::placeholder, .readonly .field textarea::placeholder { opacity: 0; }

/* ── View switch, floating bottom centre ── */
.switch {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; background: var(--ink); padding: 3px; border-radius: 999px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
}
.switch button {
  color: var(--bg); font-size: 13px; font-weight: 500; padding: 8px 18px; border-radius: 999px;
  transition: background .15s, color .15s; white-space: nowrap;
}
.switch button[aria-pressed="true"] { background: var(--bg); color: var(--ink); }
/* Friends button = who is here now, overlapped like a design tool's live viewers */
.switch .presence { display: flex; align-items: center; padding: 4px 8px 4px 12px; }
.switch .presence[aria-pressed="true"] { background: var(--bg); }
.presence .av { position: relative; flex: none; margin-left: -10px; }
.presence .av:first-child { margin-left: 0; }
.presence .face {
  width: 30px; height: 30px; border-radius: 50%; overflow: hidden;
  border: 2px solid var(--ink); background: #3A3A3A;
  display: grid; place-items: center; font-size: 12px; font-weight: 500; color: #EDEDED;
}
.presence[aria-pressed="true"] .face { border-color: var(--bg); }
.presence .face img { width: 100%; height: 100%; object-fit: cover; }
/* Opened: the switch becomes a people picker, a line under whoever's shelf is showing */
.presence.open { gap: 10px; padding: 4px 12px; }
.presence.open .av { margin-left: 0; cursor: pointer; }
.presence .av::before {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 1.5px solid var(--bg); opacity: 0; transition: opacity .15s; pointer-events: none;
}
.presence .av.on::before { opacity: 1; }
.presence.open .av:not(.on) .face { opacity: .55; }
.presence.open .av:hover .face { opacity: 1; }

/* Hovering my face offers the profile page */
.presence .pcard {
  position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); padding-bottom: 10px;
  opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 20;
}
.presence .pcard span {
  display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer;
  background: #111; color: #fff; font-size: 12px; font-weight: 500; line-height: 1; padding: 7px 12px; border-radius: 999px;
}
.presence .pcard span:hover { background: var(--red); }
.presence .av.mine:hover .pcard { opacity: 1; pointer-events: auto; }

/* Profile page: picture, name, every sentence I kept */
.profile-head { display: flex; align-items: center; gap: 18px; }
.profile-head .avatar-pick { width: 96px; height: 96px; flex: none; }
.profile-head .avatar-pick .swap {
  position: absolute; inset: auto 0 0 0; padding: 4px 0 8px; font-size: 11px; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); opacity: 0; transition: opacity .12s;
}
.profile-head .avatar-pick:hover .swap { opacity: 1; }
.profile-head .nick {
  flex: 1; min-width: 0; width: 0; font: inherit; font-size: clamp(32px, 8vw, 56px); font-weight: 500; letter-spacing: -0.03em; line-height: 1.1;
  color: var(--ink); background: none; border: 0; border-bottom: 1px solid transparent; padding: 0; border-radius: 0;
}
.profile-head .nick:hover, .profile-head .nick:focus { border-bottom-color: var(--soft); outline: none; }
.p-out { flex: none; align-self: flex-start; font-size: 12px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.p-out:hover { color: var(--red); }
.profile-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
.profile-meta .status { color: var(--muted); }
.sentences { display: grid; }
.sentence { display: grid; gap: 8px; text-align: left; padding: 18px 0; border-bottom: 1px solid var(--soft); }
.sentence:not(:disabled):hover .q { color: var(--red); }
.sentence:disabled { cursor: default; color: inherit; }
.theirs .avatar-pick { cursor: default; border: 0; }
.avatar-pick.blank { background: var(--soft); }
.avatar-pick .initial { font-size: 36px; font-weight: 500; color: var(--ink); }
.theirs .nick:hover { border-bottom-color: transparent; }
.sentence .q { font-size: 17px; line-height: 1.6; white-space: pre-wrap; transition: color .12s; }
.sentence .m { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.sentence .m b { font-weight: 500; color: var(--ink); }

/* First-run guide: a spotlight on one thing at a time, with a short card beside it */
.guide { position: fixed; inset: 0; z-index: 50; }
.guide .hole {
  position: fixed; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(10, 10, 10, .55);
  transition: left .25s, top .25s, width .25s, height .25s, border-radius .25s; pointer-events: none;
}
.guide .card {
  position: fixed; left: 50%; transform: translateX(-50%); width: min(320px, calc(100% - 32px));
  background: var(--surface); color: var(--ink); padding: 18px 18px 14px; display: grid; gap: 14px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
}
.guide .card h3 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
.guide .card p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.guide .g-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; }
.guide .step { color: var(--muted); font-variant-numeric: tabular-nums; }
.guide .g-row div { display: flex; gap: 6px; }
.guide .skip { color: var(--muted); padding: 6px 8px; }
.guide .next { background: var(--ink); color: var(--surface); padding: 6px 16px; border-radius: 999px; font-weight: 500; }

/* Name on hover */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
  background: #111; color: #fff; font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap;
  padding: 5px 8px; border-radius: 999px; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; }
.people [data-tip]::after { background: #EDEDED; color: #111; top: calc(100% + 6px); bottom: auto; }

/* ── Book sheet ── */
dialog:focus { outline: none; }
dialog {
  border: 0; padding: 0; background: var(--surface); color: var(--ink);
  width: min(600px, calc(100% - 32px)); max-height: calc(100% - 48px);
  border-radius: 0; box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
}
dialog::backdrop { background: rgba(10, 10, 10, .45); }
.sheet { display: grid; gap: 22px; padding: 18px 24px; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
.sheet-top input[type="date"] {
  font: inherit; font-size: 12px; color: var(--ink); background: transparent; border: 0; padding: 2px 0;
  font-variant-numeric: tabular-nums;
}
.close { width: 28px; height: 28px; font-size: 20px; line-height: 1; display: grid; place-items: center; }
.close:hover { color: var(--red); }

.book { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 20px; align-items: start; }
.cover-pick {
  position: relative; width: 100%; aspect-ratio: 2 / 3; overflow: hidden;
  background: var(--bg); border: 1px dashed var(--muted); display: grid; place-items: center;
  color: var(--muted); font-size: 12px; text-align: center; line-height: 1.5;
}
.cover-pick.filled { border: 0; }
.cover-pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover-pick.drag { border-color: var(--red); color: var(--red); }
.cover-pick .swap {
  position: absolute; inset: auto 0 0 0; padding: 6px; font-size: 11px;
  background: rgba(0, 0, 0, .6); color: #fff; opacity: 0; transition: opacity .15s;
}
.cover-pick.filled:hover .swap, .cover-pick.filled:focus-visible .swap { opacity: 1; }

.meta { display: grid; gap: 4px; min-width: 0; }
.field input, .field textarea {
  width: 100%; font: inherit; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--soft); border-radius: 0; padding: 6px 0;
}
.field input:focus, .field textarea:focus { outline: none; border-bottom-color: var(--ink); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .75; }
#f-title { font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: -0.02em; }
#f-author, #f-publisher { font-size: 14px; }
.pages-field { display: flex; align-items: baseline; gap: 6px; }
.pages-field input { width: 90px; font-variant-numeric: tabular-nums; }
.pages-field span { font-size: 13px; color: var(--muted); }
.stars { display: flex; gap: 2px; margin-top: 8px; }
.stars button { font-size: 21px; line-height: 1; color: var(--soft); padding: 2px; transition: color .1s, transform .1s; }
.stars button.on { color: var(--star); }
.stars button:hover { transform: scale(1.12); }

.notes { display: grid; gap: 18px; }
/* Book or diary: one sheet, two sets of fields */
.sheet-top { gap: 12px; }
.lock { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--soft); }
.lock[aria-pressed="true"] { color: var(--surface); background: var(--ink); border-color: var(--ink); }
.lock[data-tip]::after { bottom: auto; top: calc(100% + 8px); }

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const pad = (n) => String(n).padStart(2, "0");
  const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const newId = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const fmt = (n) => n.toLocaleString("ko-KR");
  const FIELDS = ["kind", "text", "locked", "date", "title", "author", "publisher", "pages", "reason", "quotes", "review", "rating", "cover", "coverData"];
  const LOCAL_KEY = "monthly-booklog.books";
  const VIEW_KEY = "monthly-booklog.view";

  const now = new Date();
  const view = { y: now.getFullYear(), m: now.getMonth() };
  let screen = "month";
  try { if (localStorage.getItem(VIEW_KEY) === "shelf") screen = "shelf"; } catch {}  // the friends view is never restored
  let books = {};          // my books
  let store = null;
  let me = null;           // my id (shared mode only)
  let userApi = null;
  let members = [];        // ids of people who have a shelf
  let names = {};          // id -> Claude account name, a fallback when no nickname
  let profiles = {};       // id -> { nickname, avatarData } from the shelf document
  let friend = null;       // id of the shelf being viewed
  let friendBooks = {};
  let unsubFriend = null;
  let dbRef = null;
  let readOnly = false;    // the open sheet belongs to someone else
  let viewerOnly = false;  // signed in without permission to write

  /* ── Storage: the artifact's database + asset store, or this browser as a fallback ── */
  function bodyOf(b) {
    const body = {};
    FIELDS.forEach((k) => { if (b[k] !== undefined && b[k] !== null && b[k] !== "") body[k] = b[k]; });
    body.quotes = (b.quotes || []).filter((q) => (q.page || "").trim() || (q.text || "").trim());
    return body;
  }
  function dbStore(db, assets, uid) {
    const shelf = db.doc("shelves/" + uid);
    let joined = false;
    return {
      async save(b) {
        const body = bodyOf(b);
        body.updatedAt = new Date().toISOString();
        body.createdAt = b.createdAt || body.updatedAt;
        if (!joined && !members.includes(uid)) await shelf.set({ since: body.updatedAt, ...(profiles[uid] || {}) });
        joined = true;
        await shelf.collection("books").doc(b.id).set(body);
      },
      async remove(b) {
        await shelf.collection("books").doc(b.id).delete();
        if (b.cover && assets) assets.delete(b.cover).catch(() => {});
      },
      async putCover(blob) {
        if (assets) { const r = await assets.upload(blob, { type: "image/jpeg" }); return { cover: r.id, url: r.url }; }
        const data = await blobToDataUrl(await shrink(blob, 360));
        return { coverData: data, url: data };
      },
      dropCover(id) { if (id && assets) assets.delete(id).catch(() => {}); },
    };
  }
  function localStore() {
    const persist = () => {
      try { localStorage.setItem(LOCAL_KEY, JSON.stringify(Object.values(books))); }
      catch { throw { message: "브라우저 저장 공간이 부족해요." }; }
    };
    return {
      async save(b) {
        const body = bodyOf(b); body.id = b.id;
        body.createdAt = b.createdAt || new Date().toISOString();
        books[b.id] = body; persist(); renderAll();
      },
      async remove(b) { delete books[b.id]; persist(); renderAll(); },
      async putCover(blob) { const data = await blobToDataUrl(await shrink(blob, 300)); return { coverData: data, url: data }; },
      dropCover() {},
    };
  }
  function loadLocal() {
    try {
      const arr = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
      const out = {}; arr.forEach((b) => { if (b && b.id) out[b.id] = b; }); return out;
    } catch { return {}; }
  }

  /* ── Images ── */
  function shrink(file, width) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const w = Math.min(width, img.naturalWidth);
        const h = Math.round(img.naturalHeight * (w / img.naturalWidth));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error("image"))), "image/jpeg", 0.86);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }
  function blobToDataUrl(blob) {
    return new Promise((resolve) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsDataURL(blob); });
  }
  const loadImg = (src) => new Promise((res) => {
    if (!src) return res(null);
    const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null);
    if (/^https?:/.test(src)) i.crossOrigin = "anonymous";  // covers on another host still need their pixels read
    i.src = src;
  });
  // On the standalone site covers live in its own storage; here they are artifact assets
  const blobUrl = (id) => (window.claude && window.claude.blobUrl ? window.claude.blobUrl(id) : "/_blob/" + id);
  const coverSrc = (b) => (b.cover ? blobUrl(b.cover) : b.coverData || "");

  /* Spine colour: the cover's most prominent colour, with vivid colours weighted up */
  const colorCache = {}, colorPending = {};
  function dominant(img) {
    const c = document.createElement("canvas"); c.width = 24; c.height = 36;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0, 24, 36);
    const px = g.getImageData(0, 0, 24, 36).data;
    const bins = {};
    for (let i = 0; i < px.length; i += 4) {
      const r = px[i], gr = px[i + 1], b = px[i + 2];
      const mx = Math.max(r, gr, b), mn = Math.min(r, gr, b);
      const sat = mx ? (mx - mn) / mx : 0;
      const key = (r >> 5) * 64 + (gr >> 5) * 8 + (b >> 5);
      const bin = bins[key] || (bins[key] = { w: 0, n: 0, r: 0, g: 0, b: 0 });
      bin.w += 1 + sat * 2.5; bin.n++; bin.r += r; bin.g += gr; bin.b += b;
    }
    let best = null;
    Object.values(bins).forEach((bin) => { if (!best || bin.w > best.w) best = bin; });
    return [best.r / best.n, best.g / best.n, best.b / best.n].map(Math.round);
  }
  const FALLBACK = ["#E8312A", "#4A9FF5", "#F2D23C", "#FF6A1F", "#8C9199", "#F6BFC6", "#774B42", "#C9CCD1", "#111111", "#F28CA6"];
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  function hash(s) { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; }
  function spineRgb(b) {
    const src = coverSrc(b);
    const fallback = hexRgb(FALLBACK[hash(b.id) % FALLBACK.length]);
    if (!src) return fallback;
    if (colorCache[src]) return colorCache[src];
    if (!colorPending[src]) {
      colorPending[src] = true;
      loadImg(src).then((img) => {
        try { colorCache[src] = img ? dominant(img) : fallback; } catch { colorCache[src] = fallback; }
        if (screen === "shelf") renderAll();
      });
    }
    return null;
  }
  const inkOn = ([r, g, b]) => ((0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? "#111111" : "#FFFFFF");

  function booksIn(y, m, map = books) {
    const prefix = `${y}-${pad(m + 1)}-`;
    return Object.values(map)
      .filter((b) => b.date && b.date.startsWith(prefix))
      .sort((a, b) => (a.date + (a.createdAt || "")).localeCompare(b.date + (b.createdAt || "")));
  }
  const pagesOf = (b) => Math.max(0, parseInt(b.pages, 10) || 0);
  const avgRating = (list) => {
    const r = list.filter((b) => b.rating > 0);
    return r.length ? (r.reduce((s, b) => s + b.rating, 0) / r.length).toFixed(1) : null;
  };
  const statLine = (list) => {
    const p = list.reduce((s, b) => s + pagesOf(b), 0), avg = avgRating(list);
    return `${list.length}권${p ? " · " + fmt(p) + "쪽" : ""}${avg ? " · ★" + avg : ""}`;
  };

  /* ── Month index ── */
  function renderMonth() {
    const { y, m } = view;
    $("#month").textContent = MON[m];
    $("#month").setAttribute("aria-label", `${y}년 ${m + 1}월`);
    renderMonthGrid($("#grid"), books, false);
    $("#hint").hidden = !store || Object.keys(books).length > 0;
  }
  function renderMonthGrid(grid, map, others) {
    const { y, m } = view;
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const total = Math.ceil((first + days) / 7) * 7;
    const list = booksIn(y, m, map);
    const byDay = {};
    list.forEach((b) => (byDay[b.date] = byDay[b.date] || []).push(b));

    grid.textContent = "";
    const tKey = todayKey();
    for (let i = 0; i < total; i++) {
      const d = i - first + 1;
      const cell = document.createElement("div");
      cell.className = "day";

  /* ── Month sheet for printing: an A4 PDF in the same index style ── */
  let jspdfLoading = null;
  function loadJsPDF() {
    if (window.jspdf) return Promise.resolve(window.jspdf);
    if (!jspdfLoading) {
      jspdfLoading = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        s.onload = () => (window.jspdf ? res(window.jspdf) : rej(new Error("jspdf")));
        s.onerror = () => { jspdfLoading = null; rej(new Error("jspdf")); };

    }
    return jspdfLoading;
  }
  function wrapLines(g, text, maxW, maxLines) {
    const lines = []; let cur = "";
    for (const ch of text) {
      if (g.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch.trim() ? ch : ""; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + "…"; }
    return lines;
  }
  async function drawMonth() {
    try { await document.fonts.ready; } catch {}
    const W = 1240, H = 1754, M = 84, GAP = 12;
    const F = getComputedStyle(document.body).fontFamily;
    const C = { ink: "#111111", muted: "#727272", soft: "#D9D9D7", red: "#E5332A" };
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, W, H);

    const { y, m } = view;
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const rows = Math.ceil((first + days) / 7);
    const list = booksIn(y, m);
    const byDay = {}; list.forEach((b) => (byDay[b.date] = byDay[b.date] || []).push(b));

    g.textBaseline = "alphabetic"; g.fillStyle = C.ink;
    g.font = `500 150px ${F}`;
    g.fillText(MON[m], M - 6, M + 150);

    const cw = (W - 2 * M - GAP * 6) / 7;
    const top = M + 250, numH = 34, rowGap = 18;
    let ch = cw * 1.5;
    const avail = H - M - (top - 30);
    if (rows * (ch + numH) + (rows - 1) * rowGap > avail) ch = (avail - (rows - 1) * rowGap) / rows - numH;

    const gridTop = top - 30;
    for (let i = 0; i < rows * 7; i++) {
      const d = i - first + 1;
      if (d < 1 || d > days) continue;
      const x = M + (i % 7) * (cw + GAP), ty = gridTop + Math.floor(i / 7) * (ch + numH + rowGap);
      g.font = `500 26px ${F}`;
      g.fillStyle = i % 7 === 0 ? C.red : C.ink;
      g.fillText(pad(d), x, ty + 24);
      const sy = ty + numH;
      g.fillStyle = C.soft; g.fillRect(x, sy, cw, 1.5);
      const dayBooks = (byDay[keyOf(y, m, d)] || []).slice(0, 3);
      const bw = dayBooks.length ? (cw - (dayBooks.length - 1) * 3) / dayBooks.length : 0;
      for (let k = 0; k < dayBooks.length; k++) {
        const b = dayBooks[k], bx = x + k * (bw + 3);
        const img = await loadImg(coverSrc(b));
        if (img) {
          const sc = Math.max(bw / img.naturalWidth, ch / img.naturalHeight);
          const sw = bw / sc, sh = ch / sc;
          g.drawImage(img, (img.naturalWidth - sw) / 2, (img.naturalHeight - sh) / 2, sw, sh, bx, sy, bw, ch);
        } else if (b.kind === "diary") {
          g.strokeStyle = C.soft; g.lineWidth = 1.5; g.strokeRect(bx, sy, bw, ch);
          g.fillStyle = C.ink; g.font = `400 16px ${F}`;
          wrapLines(g, (b.text || "").trim() || "일기", bw - 14, 8).forEach((ln, j) => g.fillText(ln, bx + 7, sy + 24 + j * 22));
        } else {
          g.fillStyle = C.ink; g.fillRect(bx, sy, bw, ch);
          g.fillStyle = "#FFFFFF"; g.font = `500 17px ${F}`;
          const lines = wrapLines(g, b.title || "제목 없음", bw - 14, 4);
          lines.forEach((ln, j) => g.fillText(ln, bx + 7, sy + ch - 10 - (lines.length - 1 - j) * 22));
        }
      }
    }
    return c;
  }

              row.appendChild(el("p", "", q.text.trim())); d.appendChild(row); });
            e.appendChild(d);

          sec("감상평", b.review);
        }
        cols.appendChild(e);
      });
      wrap.append(head, cols);
      root.appendChild(wrap);
      await Promise.race([Promise.all(waits), new Promise((res) => setTimeout(res, 6000))]);
      const page = document.createElement("style");
      page.textContent = "@page { size: A4 landscape; margin: 12mm 14mm; }";

      window.addEventListener("afterprint", done);
      window.print();
      setTimeout(done, 1000); // some browsers never fire afterprint; print() blocks until the dialog closes on most
    } finally { btn.disabled = false; btn.textContent = label; }
  });

  const joinDlg = $("#join");

  function squareAvatar(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const c = document.createElement("canvas"); c.width = c.height = 200;
        const g = c.getContext("2d");
        g.fillStyle = "#fff"; g.fillRect(0, 0, 200, 200);
        g.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 200, 200);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("image")); };
      img.src = url;
    });
  }

    const hole = $("#guide-hole"), card = $("#guide-card");
    if (!el) { hole.style.width = hole.style.height = "0px"; card.style.top = "40%"; card.style.bottom = ""; return; }
    if (el.closest(".grid")) el.scrollIntoView({ block: "center" });
    const r = el.getBoundingClientRect(), padPx = 6;
    const inBar = !!el.closest(".switch");
    Object.assign(hole.style, {
      left: r.left - padPx + "px", top: r.top - padPx + "px",
      width: r.width + padPx * 2 + "px", height: r.height + padPx * 2 + "px",
      borderRadius: inBar ? "999px" : "4px",
    });
    // card on the roomier side of the spotlight
    if (r.top + r.height / 2 > window.innerHeight / 2) { card.style.top = ""; card.style.bottom = window.innerHeight - r.top + padPx + 14 + "px"; }
    else { card.style.bottom = ""; card.style.top = r.bottom + padPx + 14 + "px"; }
    $("#guide-next").focus();
  }
  function endGuide() { $("#guide").hidden = true; }
  $("#guide-next").addEventListener("click", () => { if (guideAt < GUIDE.length - 1) { guideAt++; paintGuide(); } else endGuide(); });
  $("#guide-skip").addEventListener("click", endGuide);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#guide").hidden) endGuide(); });
  window.addEventListener("resize", () => { if (!$("#guide").hidden) paintGuide(); });

  /* Books saved before shelves existed sit in "books"; the owner moves them onto their own shelf once. */
  async function migrateLegacy(db) {
    try {
      if (!userApi || !(await userApi.isOwner())) return;
      const old = await db.collection("books").get();
      for (const d of old.docs) {
        await store.save({ id: d.id, ...d.data() });
        await db.doc("books/" + d.id).delete();
      }
    } catch {}
  }

  /* ── Start ── */
  function notice(text) { const n = $("#notice"); n.textContent = text; n.hidden = !text; }
  function watchShelves(db, onFirst) {
    let first = true;
    db.collection("shelves").onSnapshot((snap) => {
      members = snap.docs.map((d) => d.id);
      profiles = {};
      snap.docs.forEach((d) => { const v = d.data() || {}; profiles[d.id] = { nickname: v.nickname || "", avatarData: v.avatarData || "" }; });
      if (first && !snap.metadata.fromCache) { first = false; if (onFirst) onFirst(); }
      resolveNames(members.filter((id) => id !== me && !(id in names)));
      if (viewerOnly && !friend && friendIds().length) { openFriend(friendIds()[0]); return; }
      renderAll();
    }, () => {});
  }
  setScreen(screen);
  (async () => {
    const hasClaude = !!(window.claude && window.claude.use);
    let db = null, assets = null, canWrite = null;
    try { db = hasClaude ? await window.claude.use("db") : null; } catch { db = null; }
    if (db) {
      try { userApi = await window.claude.use("user"); } catch { userApi = null; }
      try { me = userApi ? await userApi.id() : null; } catch { me = null; }
      try { canWrite = userApi ? await userApi.can("data.write") : null; } catch { canWrite = null; }
    }
    if (db && me && canWrite !== false) {
      dbRef = db;
      try { assets = await window.claude.use("assets"); } catch { assets = null; }
      store = dbStore(db, assets, me);
      const fail = () => { $("#hint").hidden = false; $("#hint").textContent = "기록을 불러오지 못했어요. 새로 고쳐 주세요."; };
      db.doc("shelves/" + me).collection("books").onSnapshot(
        (snap) => { const next = {}; snap.docs.forEach((d) => { next[d.id] = { id: d.id, ...d.data() }; }); books = next; renderAll(); },
        fail
      );
      watchShelves(db, () => {
        if (!(profiles[me] && profiles[me].nickname && profiles[me].avatarData)) openJoin(false);
        else if (window.claude.firstRun) { window.claude.firstRun = false; startGuide(); }
      });
      joinRoom();
      $("#to-friends").hidden = false;
      renderPresence();
      migrateLegacy(db);
    } else if (db) {
      // Signed in, but this account may not write here: show everyone's shelves, read only.
      dbRef = db; me = me || null; viewerOnly = true;
      $("#to-friends").hidden = false;
      notice("이 계정은 아직 책장을 만들 수 없어요. 책장 주인에게 이메일로 '편집자' 초대를 받으면 내 책장을 만들 수 있어요. 지금은 다른 사람 책장만 볼 수 있어요.");
      watchShelves(db);
      joinRoom();
      picking = true;
      setScreen(screen);
    } else if (hasClaude) {
      $("#to-month").hidden = true; $("#to-shelf").hidden = true;
      $("#view-month").hidden = true;
      notice("Claude에 로그인하고 초대받은 계정으로 열어야 책장을 볼 수 있어요.");
    } else {
      store = localStore();
      books = loadLocal();
    }
    renderAll();
  })();
})();
</script>

</html>
